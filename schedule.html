<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homeroom Specials Schedule</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      margin: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .child-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 40px;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    select {
      margin: 10px 0 20px;
      padding: 6px 10px;
      font-size: 14px;
    }
    .highlight {
      background: #eaf6ff;
      border-left: 6px solid #3498db;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
    }
    .highlight h3 {
      margin-top: 0;
      color: #2980b9;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 300px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <h1>Homeroom Specials Schedule</h1>

  <!-- Child 1 -->
  <div class="child-card">
    <h2>Child 1</h2>
    <label for="homeroom1">Choose Homeroom:</label>
    <select id="homeroom1"></select>

    <div class="highlight" id="daily1">
      <h3>Today</h3>
      <p>Select a homeroom above to see today’s schedule.</p>
    </div>

    <h3>Next 5 Days</h3>
    <div id="week1" class="table-wrapper">
      <p>Select a homeroom above to see upcoming days.</p>
    </div>
  </div>

  <!-- Child 2 -->
  <div class="child-card">
    <h2>Child 2</h2>
    <label for="homeroom2">Choose Homeroom:</label>
    <select id="homeroom2"></select>

    <div class="highlight" id="daily2">
      <h3>Today</h3>
      <p>Select a homeroom above to see today’s schedule.</p>
    </div>

    <h3>Next 5 Days</h3>
    <div id="week2" class="table-wrapper">
      <p>Select a homeroom above to see upcoming days.</p>
    </div>
  </div>

  <!-- Load PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <script>
    // Published CSV Links
    const calendarUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThlCcG-UjJPsj0VqjrRCeP9dlrGpzbh9aeV7q7mTniPBNWF61UvQHLb9N_uq-GH_NjQxqVnqtJa86U/pub?gid=0&single=true&output=csv";
    const homeroomUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThlCcG-UjJPsj0VqjrRCeP9dlrGpzbh9aeV7q7mTniPBNWF61UvQHLb9N_uq-GH_NjQxqVnqtJa86U/pub?gid=414191937&single=true&output=csv";

    let calendarData = [];
    let homeroomData = {};

    // Helper: Safely get cell value ignoring extra spaces in header names
    function getVal(row, keyName) {
      if (!row) return "";
      const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
      return foundKey ? row[foundKey] : "";
    }

    function loadData() {
      Papa.parse(calendarUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          calendarData = results.data;
          
          Papa.parse(homeroomUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results2) {
              results2.data.forEach(row => {
                const homeroomVal = getVal(row, "Homeroom");
                if (homeroomVal) {
                  homeroomData[homeroomVal.trim()] = row;
                }
              });

              populateDropdown("homeroom1", "daily1", "week1");
              populateDropdown("homeroom2", "daily2", "week2");
            }
          });
        }
      });
    }

    function populateDropdown(selectId, dailyId, weekId) {
      const select = document.getElementById(selectId);
      select.innerHTML = '<option value="">-- Select Homeroom --</option>';

      Object.keys(homeroomData).forEach(hr => {
        let option = document.createElement("option");
        option.value = hr;
        option.textContent = hr;
        select.appendChild(option);
      });

      select.addEventListener("change", function() {
        renderViews(select.value, dailyId, weekId);
      });
    }

    // Safely compare dates regardless of zero padding (08/31/2026 vs 8/31/2026)
    function isSameDate(dateStr, targetDateObj) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      return d.getFullYear() === targetDateObj.getFullYear() &&
             d.getMonth() === targetDateObj.getMonth() &&
             d.getDate() === targetDateObj.getDate();
    }

    // Looks up special from Homeroom sheet matching current rotation day
    function getSpecialForDay(homeroom, rawDayValue) {
      if (!homeroom || !rawDayValue || !homeroomData[homeroom]) return "N/A";

      const cleanDay = String(rawDayValue).trim();

      if (cleanDay.toLowerCase().includes("no school")) {
        return "no school";
      }

      const homeroomRow = homeroomData[homeroom];

      // Extract digit (e.g. "Day 01" or "01" -> 1)
      const numericDay = parseInt(cleanDay.replace(/\D/g, ""), 10);
      if (isNaN(numericDay)) return "no school";

      const targetKeyPadded = `Day ${String(numericDay).padStart(2, "0")}`; // "Day 01"
      const targetKeyUnpadded = `Day${numericDay}`;                          // "Day1"
      const targetKeySpace = `Day ${numericDay}`;                            // "Day 1"

      // Match header in Homeroom sheet
      const matchedKey = Object.keys(homeroomRow).find(k => {
        const trimmed = k.trim().toLowerCase();
        return trimmed === targetKeyPadded.toLowerCase() ||
               trimmed === targetKeyUnpadded.toLowerCase() ||
               trimmed === targetKeySpace.toLowerCase();
      });

      return (matchedKey && homeroomRow[matchedKey]) ? homeroomRow[matchedKey] : "No special";
    }

    function renderViews(homeroom, dailyId, weekId) {
      const dailyDiv = document.getElementById(dailyId);
      const weekDiv = document.getElementById(weekId);

      if (!homeroom) {
        dailyDiv.innerHTML = "<h3>Today</h3><p>Select a homeroom above to see today’s schedule.</p>";
        weekDiv.innerHTML = "<p>Select a homeroom above to see upcoming days.</p>";
        return;
      }

      const today = new Date();
      const todayRow = calendarData.find(r => isSameDate(getVal(r, "Date"), today));

      if (todayRow) {
        const rawDay = getVal(todayRow, "Day");
        const dateVal = getVal(todayRow, "Date");
        const dayOfWeek = getVal(todayRow, "Day of the week");
        const special = getSpecialForDay(homeroom, rawDay);

        dailyDiv.innerHTML = `
          <h3>Today</h3>
          <p><strong>${dayOfWeek}</strong>, ${dateVal} - Day ${rawDay}</p>
          <p>Special: <strong>${special}</strong></p>
        `;
      } else {
        dailyDiv.innerHTML = "<h3>Today</h3><p>No schedule data found for today's date.</p>";
      }

      // Next 5 days
      const todayIndex = calendarData.findIndex(r => isSameDate(getVal(r, "Date"), today));
      const startIndex = todayIndex !== -1 ? todayIndex : 0;
      let nextRows = calendarData.slice(startIndex, startIndex + 6);

      if (!nextRows.length) {
        weekDiv.innerHTML = "<p>No upcoming data available.</p>";
        return;
      }

      let table = "<table><tr><th>Date</th><th>Day</th><th>Special</th></tr>";
      nextRows.forEach(r => {
        const dateVal = getVal(r, "Date");
        if (!dateVal) return;

        const rawDay = getVal(r, "Day");
        const dayOfWeek = getVal(r, "Day of the week");
        const special = getSpecialForDay(homeroom, rawDay);

        table += `<tr>
          <td>${dayOfWeek ? dayOfWeek + ", " : ""}${dateVal}</td>
          <td>${rawDay}</td>
          <td>${special}</td>
        </tr>`;
      });
      table += "</table>";
      weekDiv.innerHTML = `<div class="table-wrapper">${table}</div>`;
    }

    window.onload = loadData;
  </script>
</body>
</html>
